services:
  - type: web
    name: agromatch-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: storage/agromatch.db
      - key: MUSIC_PROVIDER
        value: procedural
